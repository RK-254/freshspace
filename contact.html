<form class="form-box" onsubmit="sendToWhatsApp(event)">
<label>Your Name</label>
<input type="text" id="wName" required placeholder="e.g. John Kamau">

<label>Your Phone</label>
<input type="tel" id="wPhone" required placeholder="e.g. 0712 345 678">

<label>Service Needed</label>
<select id="wService">
<option>Office Cleaning</option>
<option>Home Cleaning</option>
<option>Pest Control</option>
<option>Deep Cleaning</option>
<option>Move In/Out</option>
</select>

<label>Message</label>
<textarea id="wMessage" required placeholder="Location, house size..."></textarea>

<button type="submit" class="submit-btn">Send via WhatsApp</button>
</form>

<script>
function sendToWhatsApp(e){
e.preventDefault();
var name=document.getElementById('wName').value;
var phone=document.getElementById('wPhone').value;
var service=document.getElementById('wService').value;
var msg=document.getElementById('wMessage').value;
var text=`NEW QUOTE%0AName: ${name}%0APhone: ${phone}%0AService: ${service}%0AMessage: ${msg}`;
window.open(`https://wa.me/254181189836?text=${text}`,'_blank');
}
</script>
